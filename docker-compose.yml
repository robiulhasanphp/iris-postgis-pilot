services:
  db:
    image: postgis/postgis:16-3.4
    container_name: iris-postgis-db
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iris"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - iris_pgdata:/var/lib/postgresql/data

volumes:
  iris_pgdata:
